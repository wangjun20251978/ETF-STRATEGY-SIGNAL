name: 每日更新 ETF 策略信号看板

on:
  schedule:
    - cron: '45 20 * * *'  # 早场尝试①(北京4:45名义→实测+3h≈7:45-9:00)
    - cron: '15 22 * * *'  # 早场尝试②(北京6:15名义→实测+3h≈9:15)
    - cron: '0 7 * * *'   # 收盘后(北京15:00名义→实测约22:20)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行生成脚本（抓取行情 + 生成 index.html）
        run: python build_skill_site.py
      - name: 提交并推送更新（若内容有变化）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "自动更新 $(date +'%Y-%m-%d %H:%M')"
          git push
